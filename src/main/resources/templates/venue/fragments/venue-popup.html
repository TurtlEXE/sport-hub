<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="popupContent">
    <div class="relative flex flex-col h-full bg-white">
        <!-- Header Image & Basic Info -->
        <div class="h-56 relative overflow-hidden flex-shrink-0">
            <img th:src="${venue.imageUrl}" alt="Venue" class="w-full h-full object-cover">
            <div class="absolute inset-0 bg-gradient-to-t from-black/70 via-black/20 to-transparent"></div>
            
            <div class="absolute bottom-4 left-6 right-6">
                <div class="flex justify-between items-end">
                    <div>
                        <h2 class="text-2xl font-black text-white mb-1" th:text="${venue.name}">Venue Name</h2>
                        <p class="text-white/90 text-sm flex items-center gap-1">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                            </svg>
                            <span th:text="${venue.address}">Address</span>
                        </p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tab Navigation -->
        <div class="flex border-b border-slate-200 px-6 pt-2 bg-white sticky top-0 z-10">
            <button onclick="document.getElementById('tab-info').classList.remove('hidden'); document.getElementById('tab-services').classList.add('hidden'); this.classList.add('border-primary-blue', 'text-primary-blue'); this.classList.remove('border-transparent', 'text-slate-500', 'hover:text-slate-700'); document.getElementById('btn-tab-services').classList.remove('border-primary-blue', 'text-primary-blue'); document.getElementById('btn-tab-services').classList.add('border-transparent', 'text-slate-500', 'hover:text-slate-700');" 
                    id="btn-tab-info"
                    class="pb-3 px-4 font-bold text-sm border-b-2 border-primary-blue text-primary-blue transition-colors">
                Thông tin chi tiết
            </button>
            <button onclick="document.getElementById('tab-services').classList.remove('hidden'); document.getElementById('tab-info').classList.add('hidden'); this.classList.add('border-primary-blue', 'text-primary-blue'); this.classList.remove('border-transparent', 'text-slate-500', 'hover:text-slate-700'); document.getElementById('btn-tab-info').classList.remove('border-primary-blue', 'text-primary-blue'); document.getElementById('btn-tab-info').classList.add('border-transparent', 'text-slate-500', 'hover:text-slate-700');" 
                    id="btn-tab-services"
                    class="pb-3 px-4 font-bold text-sm border-b-2 border-transparent text-slate-500 hover:text-slate-700 transition-colors">
                Dịch vụ & Bảng giá
            </button>
        </div>

        <!-- Tab Content Container -->
        <div class="overflow-y-auto flex-1 p-6 relative">
            
            <!-- Tab 1: Information -->
            <div id="tab-info" class="block space-y-6">
                <!-- Description -->
                <div>
                    <h3 class="text-xs font-bold text-slate-400 uppercase mb-2">Giới thiệu</h3>
                    <p class="text-slate-600 text-sm leading-relaxed" th:text="${venue.description != null ? venue.description : 'Đang cập nhật thông tin chi tiết...'}"></p>
                </div>

                <div class="grid grid-cols-2 gap-6">
                    <!-- Rating hidden for now -->
                    <!--
                    <div>
                    <div>
                        <div class="text-xs font-bold text-slate-400 uppercase mb-1" th:text="#{venue.popup.openingHours}">Giờ hoạt động</div>
                        <div class="text-sm font-bold text-slate-700" th:text="${venue.openingHours}">00:00 - 00:00</div>
                    </div>
                    <div>
                        <div class="text-xs font-bold text-slate-400 uppercase mb-1" th:text="#{venue.popup.managedBy}">Quản lý bởi</div>
                        <div class="text-sm font-bold text-slate-700 flex items-center gap-1.5">
                            <span class="w-5 h-5 rounded-full bg-blue-100 text-primary-blue flex items-center justify-center text-[10px]">S</span>
                            <span th:text="${venue.ownerName}">SportHub Admin</span>
                        </div>
                    </div>
                </div>

                <div class="mb-8">
                    <h4 class="text-sm font-bold text-slate-900 mb-4" th:text="#{venue.popup.sports}">Các môn thể thao</h4>
                    <div class="flex flex-wrap gap-2">
                        <span th:each="sport : ${venue.sports}" 
                              class="bg-blue-50 text-primary-blue text-xs font-bold px-3 py-1.5 rounded-lg flex items-center gap-1.5">
                            <span th:if="${sport.sportCode == 'FOOTBALL'}">⚽</span>
                            <span th:if="${sport.sportCode == 'BADMINTON'}">🏸</span>
                            <span th:if="${sport.sportCode == 'TENNIS'}">🎾</span>
                            <span th:if="${sport.sportCode == 'BASKETBALL'}">🏀</span>
                            <span th:if="${sport.sportCode == 'PICKLEBALL'}">🏓</span>
                            <span th:if="${sport.sportCode != 'FOOTBALL' && sport.sportCode != 'BADMINTON' && sport.sportCode != 'TENNIS' && sport.sportCode != 'BASKETBALL' && sport.sportCode != 'PICKLEBALL'}">🏆</span>
                            <span th:text="${sport.sportName}">Môn thể thao</span>
                        </span>
                    </div>
                </div>

                <div>
                    <h4 class="text-sm font-bold text-slate-900 mb-4" th:text="#{venue.popup.amenities}">Tiện ích & Dịch vụ</h4>
                    <div class="grid grid-cols-2 gap-3">
                        <div th:each="amenity : ${venue.amenityNames}" class="flex items-center gap-2 text-sm text-slate-600">
                            <span class="text-lg">✨</span>
                            <span th:text="${amenity}">Tiện ích</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Tab 2: Services and Prices -->
            <div id="tab-services" class="hidden space-y-8">
                
                <!-- Price Table -->
                <div>
                    <h3 class="text-sm font-bold text-primary-blue uppercase mb-3 flex items-center gap-2">
                        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                        Bảng giá sân 
                        <span class="text-xs text-slate-500 font-medium normal-case ml-auto" th:if="${venue.slotDurationMinutes != null}" th:text="'(Giá mỗi ' + ${venue.slotDurationMinutes} + ' phút / 1 slot)'">(Giá mỗi 60 phút / 1 slot)</span>
                    </h3>
                    
                    <div th:if="${venue.groupedPriceRules == null or venue.groupedPriceRules.isEmpty()}" class="text-sm text-slate-500 italic">
                        Đang cập nhật bảng giá...
                    </div>
                    
                    <div th:each="entry : ${venue.groupedPriceRules}" class="mb-4 overflow-hidden rounded-xl border border-slate-200">
                        <div class="bg-slate-50 px-4 py-2 border-b border-slate-200">
                            <span class="font-bold text-slate-700 text-sm" th:text="${entry.key == 'WEEKDAY' ? 'Từ Thứ 2 - Thứ 6' : (entry.key == 'WEEKEND' ? 'Thứ 7 & Chủ Nhật' : entry.key)}">Ngày thường</span>
                        </div>
                        <table class="w-full text-sm text-left">
                            <tbody>
                                <tr th:each="rule, iterStat : ${entry.value}" th:class="${!iterStat.last} ? 'border-b border-slate-100' : ''">
                                    <td class="px-4 py-3 font-medium text-slate-600">
                                        <span th:text="${rule.startTime} + ' - ' + ${rule.endTime}">00:00 - 00:00</span>
                                    </td>
                                    <td class="px-4 py-3 text-right font-bold text-slate-900">
                                        <span th:text="${#numbers.formatDecimal(rule.pricePerSlot, 0, 'COMMA', 0, 'POINT')} + ' đ'">100.000 đ</span>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Services List -->
                <div>
                    <h3 class="text-sm font-bold text-secondary-green uppercase mb-3 flex items-center gap-2">
                        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" /></svg>
                        Danh sách dịch vụ
                    </h3>
                    
                    <div th:if="${venue.groupedServices == null or venue.groupedServices.isEmpty()}" class="text-sm text-slate-500 italic">
                        Sân chưa cung cấp dịch vụ thêm.
                    </div>

                    <div th:each="entry : ${venue.groupedServices}" class="mb-4 overflow-hidden rounded-xl border border-slate-200">
                        <div class="bg-slate-50 px-4 py-2 border-b border-slate-200">
                            <span class="font-bold text-slate-700 text-sm" th:text="${entry.key}">Dịch vụ khác</span>
                        </div>
                        <table class="w-full text-sm text-left">
                            <tbody>
                                <tr th:each="service, iterStat : ${entry.value}" th:class="${!iterStat.last} ? 'border-b border-slate-100' : ''">
                                    <td class="px-4 py-3 font-medium text-slate-600" th:text="${service.productName}">
                                        Tên dịch vụ
                                    </td>
                                    <td class="px-4 py-3 text-right text-slate-800">
                                        <span class="font-bold" th:text="${#numbers.formatDecimal(service.price, 0, 'COMMA', 0, 'POINT')} + ' đ'">50.000 đ</span>
                                        <span class="text-xs text-slate-500" th:if="${service.rentalUnit != null}" th:text="' / ' + ${service.rentalUnit}">/ giờ</span>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            
        </div>
        
        <!-- Footer Checkout Button -->
        <div class="p-6 border-t border-slate-100 bg-white">
            <a th:href="@{/booking/{id}(id=${venue.facilityId})}" class="block text-center w-full bg-slate-900 hover:bg-primary-blue text-white font-bold py-3.5 rounded-xl transition-all shadow-lg hover:shadow-xl">
                <span th:text="#{venue.card.bookNow}">ĐẶT LỊCH NGAY</span>
            </a>
        </div>
    </div>
</div>

</body>
</html>
