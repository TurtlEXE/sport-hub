<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">

<head>
    <title th:text="'Booking - ' + ${venue.name}">Booking</title>
</head>

<body>

    <main layout:fragment="content" class="py-8 bg-slate-50 min-h-screen">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="bg-white rounded-2xl p-8 shadow-sm border border-slate-100 mb-8 text-center">
                <h1 class="text-3xl font-black text-slate-900 mb-4" th:text="${venue.name}">Venue Name</h1>
                <p class="text-slate-600 mb-6" th:text="${venue.address}">Address</p>
                <div class="flex justify-center mb-6">
                    <img th:src="${venue.imageUrl}" alt="Venue Image" class="w-full max-w-2xl h-80 object-cover rounded-xl shadow-md">
                </div>
                <div class="inline-block bg-primary-blue/10 text-primary-blue px-4 py-2 rounded-lg font-bold text-lg">
                    Booking functionality is under development...
                </div>
            </div>
            
            <div class="text-center">
                <a href="/venues" class="inline-flex items-center gap-2 text-slate-500 hover:text-slate-800 font-semibold transition-colors">
                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                    </svg>
                    Back to venue list
                </a>
            </div>
        </div>
    </main>

</body>

</html>
