<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{dashboard-layout}">
<head>
    <title>Chi tiết và duyệt cơ sở</title>
</head>
<body>
    <div layout:fragment="sidebar-menu" th:replace="~{admin/fragments/sidebar :: sidebar('facilities')}"></div>

    <div layout:fragment="header-title" class="flex-1">
        <h1 class="text-xl font-bold text-slate-900">Chi Tiết và Duyệt Cơ Sở</h1>
        <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-0.5">ADMIN DASHBOARD • FACILITY APPROVAL</p>
    </div>

    <div layout:fragment="content">
        <div class="container mx-auto px-4 py-6">
            <div class="flex justify-between items-center mb-6">
                <h1 class="text-2xl font-bold text-gray-800">Chi tiết cơ sở chờ duyệt</h1>
                <a href="/admin/facilities" class="text-gray-500 hover:text-gray-700">← Quay lại danh sách</a>
            </div>
            
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <!-- Left panel: Info -->
                <div class="lg:col-span-2 space-y-6">
                <div class="bg-white rounded-lg shadow border p-6">
                    <h3 class="text-lg font-medium mb-4">Thông tin cơ bản</h3>
                    <div id="facilityInfo">Loading...</div>
                </div>
            </div>
            
            <!-- Right panel: Action -->
            <div class="space-y-6">
                <div class="bg-white rounded-lg shadow border p-6">
                    <h3 class="text-lg font-medium mb-4 border-b pb-2">Quyết định</h3>
                    
                    <div id="actionContainer" class="hidden space-y-3">
                        <button id="btnApprove" class="w-full bg-green-600 hover:bg-green-700 text-white py-2 rounded-md font-medium transition">✅ Duyệt cơ sở</button>
                        <button id="btnReject" class="w-full bg-red-600 hover:bg-red-700 text-white py-2 rounded-md font-medium transition">❌ Từ chối</button>
                    </div>
                    
                    <div id="statusContainer" class="mt-4"></div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Reject Modal -->
    <div id="rejectModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center">
        <div class="bg-white rounded-lg w-96 p-6">
            <h3 class="text-lg font-bold mb-4">Lý do từ chối</h3>
            <textarea id="rejectionReason" class="w-full border rounded-md p-2 mb-4" rows="4" placeholder="Nhập lý do từ chối để chủ sân khắc phục..."></textarea>
            <div class="flex justify-end space-x-2">
                <button id="btnCancelReject" class="px-4 py-2 bg-gray-200 rounded-md">Hủy</button>
                <button id="btnConfirmReject" class="px-4 py-2 bg-red-600 text-white rounded-md">Xác nhận</button>
            </div>
        </div>
    </div>
    
    <th:block layout:fragment="pageScripts">
        <script th:inline="javascript">
            const facilityId = /*[[${facilityId}]]*/ 0;
        </script>
        <script th:src="@{/js/admin-facility-review.js}"></script>
    </th:block>
</html>
