<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{dashboard-layout}">

<head>
    <title>Voucher Form</title>
</head>

<body>
    <!-- Sidebar Menu -->
    <div layout:fragment="sidebar-menu" class="py-6 px-4 space-y-2">
        <div class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-4 px-4">PLATFORM REGISTRY</div>
        
        <a href="/admin/dashboard" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-semibold text-slate-400 hover:text-white hover:bg-white/5 transition-colors">
            <svg class="w-5 h-5 opacity-70" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
            Courts Catalog
        </a>
        <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-semibold text-slate-400 hover:text-white hover:bg-white/5 transition-colors">
            <svg class="w-5 h-5 opacity-70" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
            All Bookings
        </a>
        <a href="/admin/accounts" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-semibold text-slate-400 hover:text-white hover:bg-white/5 transition-colors">
            <svg class="w-5 h-5 opacity-70" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
            User Directory
        </a>
        <a href="/admin/vouchers" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-bold text-white bg-gradient-to-r from-primary-pink to-rose-400 shadow-lg shadow-primary-pink/30">
            <svg class="w-5 h-5 opacity-90" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z"/></svg>
            Vouchers
        </a>
        <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-semibold text-slate-400 hover:text-white hover:bg-white/5 transition-colors">
            <svg class="w-5 h-5 opacity-70" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
            Global Settings
        </a>
    </div>

    <!-- Header Title -->
    <div layout:fragment="header-title" class="flex-1">
        <h1 class="text-xl font-bold text-slate-900" th:text="${voucherForm.id == null ? 'Create Voucher' : 'Edit Voucher'}">Voucher Form</h1>
        <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-0.5" th:text="${voucherForm.id == null ? 'PROVISION NEW DISCOUNT' : 'MODIFY DISCOUNT RECORD'}">ACTION</p>
    </div>

    <!-- Main Content -->
    <div layout:fragment="content">
        <div class="max-w-4xl mx-auto">
            <div th:if="${errorMessage}" class="mb-6 bg-rose-50 border-l-4 border-rose-500 p-4 rounded-r-lg flex items-center gap-3">
                <svg class="w-5 h-5 text-rose-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                <span class="text-sm font-semibold text-rose-800" th:text="${errorMessage}"></span>
            </div>

            <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-8 relative overflow-hidden">
                <div class="absolute top-0 right-0 w-32 h-32 bg-primary-pink/5 rounded-full blur-3xl"></div>
                <div class="absolute bottom-0 left-0 w-24 h-24 bg-rose-400/5 rounded-full blur-2xl"></div>

                <div class="mb-8 relative z-10">
                    <h2 class="text-lg font-black text-slate-900">Voucher Details</h2>
                    <p class="text-sm text-slate-500 mt-1">Please fill in the promotional information below.</p>
                </div>

                <form th:action="${voucherForm.id == null ? '/admin/vouchers/create' : '/admin/vouchers/edit/' + voucherForm.id}" 
                      th:object="${voucherForm}" method="post" class="space-y-6 relative z-10">
                    
                    <input type="hidden" th:field="*{id}" />

                    <!-- General Info -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Voucher Code <span class="text-rose-500">*</span></label>
                            <input type="text" th:field="*{code}" class="w-full px-4 py-3 font-mono bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-primary-pink/20 focus:border-primary-pink transition-colors text-sm" placeholder="SUMMER24">
                            <p th:if="${#fields.hasErrors('code')}" th:errors="*{code}" class="text-xs text-rose-500 mt-1 font-semibold"></p>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Voucher Name <span class="text-rose-500">*</span></label>
                            <input type="text" th:field="*{name}" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-primary-pink/20 focus:border-primary-pink transition-colors text-sm" placeholder="Summer Sale 2024">
                            <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="text-xs text-rose-500 mt-1 font-semibold"></p>
                        </div>
                    </div>

                    <!-- Description -->
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Description</label>
                        <textarea th:field="*{description}" rows="2" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-primary-pink/20 focus:border-primary-pink transition-colors text-sm" placeholder="Details about this voucher..."></textarea>
                    </div>

                    <!-- Discount Values -->
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div>
                            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Discount Type <span class="text-rose-500">*</span></label>
                            <select th:field="*{discountType}" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-primary-pink/20 focus:border-primary-pink transition-colors text-sm font-semibold text-slate-700">
                                <option th:each="type : ${discountTypes}" th:value="${type}" th:text="${type}"></option>
                            </select>
                            <p th:if="${#fields.hasErrors('discountType')}" th:errors="*{discountType}" class="text-xs text-rose-500 mt-1 font-semibold"></p>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Discount Value <span class="text-rose-500">*</span></label>
                            <input type="number" step="0.01" th:field="*{discountValue}" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-primary-pink/20 focus:border-primary-pink transition-colors text-sm" placeholder="0.00">
                            <p th:if="${#fields.hasErrors('discountValue')}" th:errors="*{discountValue}" class="text-xs text-rose-500 mt-1 font-semibold"></p>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Max Discount Amount</label>
                            <input type="number" step="0.01" th:field="*{maxDiscountAmount}" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-primary-pink/20 focus:border-primary-pink transition-colors text-sm" placeholder="Leave blank for no max">
                            <p th:if="${#fields.hasErrors('maxDiscountAmount')}" th:errors="*{maxDiscountAmount}" class="text-xs text-rose-500 mt-1 font-semibold"></p>
                        </div>
                    </div>

                    <!-- Conditions & Limits -->
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div>
                            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Minimum Order Amount</label>
                            <input type="number" step="0.01" th:field="*{minOrderAmount}" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-primary-pink/20 focus:border-primary-pink transition-colors text-sm" placeholder="0.00">
                            <p th:if="${#fields.hasErrors('minOrderAmount')}" th:errors="*{minOrderAmount}" class="text-xs text-rose-500 mt-1 font-semibold"></p>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Total Usage Limit</label>
                            <input type="number" step="1" th:field="*{usageLimit}" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-primary-pink/20 focus:border-primary-pink transition-colors text-sm" placeholder="Total times this can be used">
                            <p th:if="${#fields.hasErrors('usageLimit')}" th:errors="*{usageLimit}" class="text-xs text-rose-500 mt-1 font-semibold"></p>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Per User Limit</label>
                            <input type="number" step="1" th:field="*{perUserLimit}" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-primary-pink/20 focus:border-primary-pink transition-colors text-sm" placeholder="Uses per person (e.g. 1)">
                            <p th:if="${#fields.hasErrors('perUserLimit')}" th:errors="*{perUserLimit}" class="text-xs text-rose-500 mt-1 font-semibold"></p>
                        </div>
                    </div>

                    <!-- Validity Period -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Active Time (Valid From) <span class="text-rose-500">*</span></label>
                            <input type="datetime-local" th:field="*{validFrom}" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-primary-pink/20 focus:border-primary-pink transition-colors text-sm">
                            <p th:if="${#fields.hasErrors('validFrom')}" th:errors="*{validFrom}" class="text-xs text-rose-500 mt-1 font-semibold"></p>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Disable Time (Valid To) <span class="text-rose-500">*</span></label>
                            <input type="datetime-local" th:field="*{validTo}" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-primary-pink/20 focus:border-primary-pink transition-colors text-sm">
                            <p th:if="${#fields.hasErrors('validTo')}" th:errors="*{validTo}" class="text-xs text-rose-500 mt-1 font-semibold"></p>
                        </div>
                    </div>

                    <!-- Status -->
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Voucher Status</label>
                        <div class="flex items-center h-[46px] px-2">
                            <label class="relative inline-flex items-center cursor-pointer">
                                <input type="checkbox" th:field="*{isActive}" class="sr-only peer">
                                <div class="w-11 h-6 bg-slate-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-emerald-300 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-emerald-500"></div>
                                <span class="ml-3 text-sm font-bold text-slate-700 uppercase tracking-widest">Active</span>
                            </label>
                        </div>
                    </div>

                    <!-- Action Buttons -->
                    <div class="flex items-center gap-4 pt-4 mt-8 border-t border-slate-100">
                        <button type="submit" class="flex-1 py-3 bg-primary-pink hover:bg-rose-600 text-white font-bold rounded-xl transition-colors shadow-lg shadow-rose-500/30 text-sm">
                            <span th:text="${voucherForm.id == null ? 'Create Voucher' : 'Save Changes'}">Submit</span>
                        </button>
                        <a href="/admin/vouchers" class="flex-1 py-3 text-center bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 font-bold rounded-xl transition-colors text-sm">
                            Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>

        <script>
            document.addEventListener("DOMContentLoaded", function() {
                const discountTypeSelect = document.getElementById('discountType');
                const maxDiscountAmountInput = document.getElementById('maxDiscountAmount');

                function toggleMaxDiscount() {
                    if (discountTypeSelect.value === 'FIXED_AMOUNT') {
                        maxDiscountAmountInput.disabled = true;
                        maxDiscountAmountInput.value = ''; 
                        maxDiscountAmountInput.classList.add('opacity-50', 'bg-slate-100', 'cursor-not-allowed');
                    } else {
                        maxDiscountAmountInput.disabled = false;
                        maxDiscountAmountInput.classList.remove('opacity-50', 'bg-slate-100', 'cursor-not-allowed');
                    }
                }

                if (discountTypeSelect && maxDiscountAmountInput) {
                    discountTypeSelect.addEventListener('change', toggleMaxDiscount);
                    // Initialize on page load
                    toggleMaxDiscount();
                }
            });
        </script>
    </div>
</body>
</html>
