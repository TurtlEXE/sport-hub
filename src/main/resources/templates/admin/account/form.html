<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{dashboard-layout}">

<head>
    <title>Account Form</title>
</head>

<body>
    <!-- Sidebar Menu (matching the layout) -->
    <div layout:fragment="sidebar-menu" class="py-6 px-4 space-y-2">
        <div class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-4 px-4">PLATFORM REGISTRY</div>
        <a href="/admin/dashboard" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-semibold text-slate-400 hover:text-white hover:bg-white/5 transition-colors">
            <svg class="w-5 h-5 opacity-70" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
            Courts Catalog
        </a>
        <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-semibold text-slate-400 hover:text-white hover:bg-white/5 transition-colors">
            <svg class="w-5 h-5 opacity-70" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
            All Bookings
        </a>
        <a href="/admin/accounts" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-bold text-white bg-gradient-to-r from-primary-pink to-rose-400 shadow-lg shadow-primary-pink/30">
            <svg class="w-5 h-5 opacity-90" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
            User Directory
        </a>
        <a href="/admin/vouchers" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-semibold text-slate-400 hover:text-white hover:bg-white/5 transition-colors">
            <svg class="w-5 h-5 opacity-70" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z"/></svg>
            Vouchers
        </a>
        <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-semibold text-slate-400 hover:text-white hover:bg-white/5 transition-colors">
            <svg class="w-5 h-5 opacity-70" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
            Global Settings
        </a>
    </div>

    <!-- Header Title -->
    <div layout:fragment="header-title" class="flex-1">
        <h1 class="text-xl font-bold text-slate-900" th:text="${accountForm.id == null ? 'Create Account' : 'Edit Account'}">Account Form</h1>
        <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-0.5" th:text="${accountForm.id == null ? 'PROVISION NEW USER' : 'MODIFY USER RECORD'}">ACTION</p>
    </div>

    <!-- Main Content -->
    <div layout:fragment="content">
        <div class="max-w-2xl mx-auto">
            <div th:if="${errorMessage}" class="mb-6 bg-rose-50 border-l-4 border-rose-500 p-4 rounded-r-lg flex items-center gap-3">
                <svg class="w-5 h-5 text-rose-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                <span class="text-sm font-semibold text-rose-800" th:text="${errorMessage}"></span>
            </div>

            <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-8 relative overflow-hidden">
                <div class="absolute top-0 right-0 w-32 h-32 bg-primary-blue/5 rounded-full blur-3xl"></div>
                <div class="absolute bottom-0 left-0 w-24 h-24 bg-primary-pink/5 rounded-full blur-2xl"></div>

                <div class="mb-8 relative z-10">
                    <h2 class="text-lg font-black text-slate-900">Account Details</h2>
                    <p class="text-sm text-slate-500 mt-1">Please fill in the information below.</p>
                </div>

                <form th:action="${accountForm.id == null ? '/admin/accounts/create' : '/admin/accounts/edit/' + accountForm.id}" 
                      th:object="${accountForm}" method="post" class="space-y-6 relative z-10">
                    
                    <input type="hidden" th:field="*{id}" />

                    <!-- Full Name -->
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Full Name <span class="text-rose-500">*</span></label>
                        <input type="text" th:field="*{fullName}" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-primary-blue/20 focus:border-primary-blue transition-colors text-sm" placeholder="John Doe">
                        <p th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}" class="text-xs text-rose-500 mt-1 font-semibold"></p>
                    </div>

                    <!-- Grid for Email and Phone -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Email <span class="text-rose-500">*</span></label>
                            <input type="email" th:field="*{email}" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-primary-blue/20 focus:border-primary-blue transition-colors text-sm" placeholder="user@example.com">
                            <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-xs text-rose-500 mt-1 font-semibold"></p>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Phone <span class="text-rose-500">*</span></label>
                            <input type="text" th:field="*{phone}" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-primary-blue/20 focus:border-primary-blue transition-colors text-sm" placeholder="+123456789">
                            <p th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}" class="text-xs text-rose-500 mt-1 font-semibold"></p>
                        </div>
                    </div>

                    <!-- Role & Status -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Role <span class="text-rose-500">*</span></label>
                            <select th:field="*{role}" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-primary-blue/20 focus:border-primary-blue transition-colors text-sm font-semibold text-slate-700">
                                <option th:each="r : ${roles}" th:value="${r}" th:text="${r}"></option>
                            </select>
                            <p th:if="${#fields.hasErrors('role')}" th:errors="*{role}" class="text-xs text-rose-500 mt-1 font-semibold"></p>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Account Status</label>
                            <div class="flex items-center h-[46px] px-2">
                                <label class="relative inline-flex items-center cursor-pointer">
                                    <input type="checkbox" th:field="*{isActive}" class="sr-only peer">
                                    <div class="w-11 h-6 bg-slate-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-emerald-300 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-emerald-500"></div>
                                    <span class="ml-3 text-sm font-bold text-slate-700 uppercase tracking-widest">Active</span>
                                </label>
                            </div>
                        </div>
                    </div>

                    <!-- Password -->
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Password <span th:if="${accountForm.id == null}" class="text-rose-500">*</span></label>
                        <input type="password" th:field="*{password}" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-primary-blue/20 focus:border-primary-blue transition-colors text-sm" placeholder="••••••••">
                        <p th:if="${accountForm.id != null}" class="text-[10px] font-bold text-slate-400 mt-2 uppercase tracking-widest">Leave blank to keep current password</p>
                        <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="text-xs text-rose-500 mt-1 font-semibold"></p>
                    </div>

                    <!-- Action Buttons -->
                    <div class="flex items-center gap-4 pt-4 mt-8 border-t border-slate-100">
                        <button type="submit" class="flex-1 py-3 bg-primary-blue hover:bg-blue-600 text-white font-bold rounded-xl transition-colors shadow-lg shadow-blue-500/30 text-sm">
                            <span th:text="${accountForm.id == null ? 'Create Account' : 'Save Changes'}">Submit</span>
                        </button>
                        <a href="/admin/accounts" class="flex-1 py-3 text-center bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 font-bold rounded-xl transition-colors text-sm">
                            Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
