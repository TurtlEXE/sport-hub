<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{dashboard-layout}">

<head>
    <title>User Directory</title>
</head>

<body>
    <!-- Sidebar Menu (matching the layout) -->
    <div layout:fragment="sidebar-menu" class="py-6 px-4 space-y-2">
        <div class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-4 px-4">PLATFORM REGISTRY</div>
        
        <a href="/admin/dashboard" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-semibold text-slate-400 hover:text-white hover:bg-white/5 transition-colors">
            <svg class="w-5 h-5 opacity-70" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
            Courts Catalog
        </a>
        <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-semibold text-slate-400 hover:text-white hover:bg-white/5 transition-colors">
            <svg class="w-5 h-5 opacity-70" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
            All Bookings
        </a>
        <a href="/admin/accounts" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-bold text-white bg-gradient-to-r from-primary-pink to-rose-400 shadow-lg shadow-primary-pink/30">
            <svg class="w-5 h-5 opacity-90" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
            User Directory
        </a>
        <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-semibold text-slate-400 hover:text-white hover:bg-white/5 transition-colors">
            <svg class="w-5 h-5 opacity-70" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
            Global Settings
        </a>
    </div>

    <!-- Header Title -->
    <div layout:fragment="header-title" class="flex-1">
        <h1 class="text-xl font-bold text-slate-900">User Directory</h1>
        <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-0.5">MANAGE SYSTEM ACCOUNTS</p>
    </div>

    <!-- Main Content -->
    <div layout:fragment="content">
        <!-- Alerts -->
        <div th:if="${successMessage}" class="mb-6 bg-emerald-50 border-l-4 border-emerald-500 p-4 rounded-r-lg flex items-center gap-3">
            <svg class="w-5 h-5 text-emerald-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
            <span class="text-sm font-semibold text-emerald-800" th:text="${successMessage}"></span>
        </div>
        <div th:if="${errorMessage}" class="mb-6 bg-rose-50 border-l-4 border-rose-500 p-4 rounded-r-lg flex items-center gap-3">
            <svg class="w-5 h-5 text-rose-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            <span class="text-sm font-semibold text-rose-800" th:text="${errorMessage}"></span>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6">
            <div class="flex items-center justify-between mb-6">
                <div>
                    <h2 class="text-sm font-black text-slate-900 uppercase tracking-wider">ALL ACCOUNTS</h2>
                    <p class="text-xs text-slate-500 mt-1">Manage user roles and statuses.</p>
                </div>
                <a th:href="@{/admin/accounts/create}" class="px-4 py-2 bg-primary-blue hover:bg-blue-600 text-white text-xs font-bold rounded-xl transition-colors shadow-lg shadow-blue-500/30 flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                    New Account
                </a>
            </div>
            
            <div class="w-full overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="text-[10px] font-bold text-slate-400 uppercase tracking-wider border-b border-slate-100">
                            <th class="pb-3 px-4">USER DETAILS</th>
                            <th class="pb-3 px-4">ROLE</th>
                            <th class="pb-3 px-4">PHONE</th>
                            <th class="pb-3 px-4">STATUS</th>
                            <th class="pb-3 px-4 text-center">ACTIONS</th>
                        </tr>
                    </thead>
                    <tbody class="text-sm divide-y divide-slate-100">
                        <tr th:each="account : ${accounts}" class="hover:bg-slate-50 transition-colors">
                            <td class="py-4 px-4">
                                <div class="flex items-center gap-3">
                                    <div class="w-9 h-9 rounded-full bg-slate-200 text-slate-500 flex items-center justify-center font-bold text-sm">
                                        <span th:text="${#strings.substring(account.fullName, 0, 1)}" class="uppercase">U</span>
                                    </div>
                                    <div>
                                        <div class="font-bold text-slate-900" th:text="${account.fullName}">Full Name</div>
                                        <div class="text-[10px] text-slate-400" th:text="${account.email}">email@domain.com</div>
                                    </div>
                                </div>
                            </td>
                            <td class="py-4 px-4">
                                <span class="text-[9px] font-black px-2 py-1 rounded"
                                      th:classappend="${account.role.name() == 'ADMIN'} ? 'text-rose-600 bg-rose-50' : (${account.role.name() == 'OWNER'} ? 'text-indigo-600 bg-indigo-50' : (${account.role.name() == 'STAFF'} ? 'text-amber-600 bg-amber-50' : 'text-blue-600 bg-blue-50'))"
                                      th:text="${account.role}">ROLE</span>
                            </td>
                            <td class="py-4 px-4 text-slate-600 font-medium" th:text="${account.phone}">
                                Phone
                            </td>
                            <td class="py-4 px-4">
                                <span th:if="${account.isActive}" class="text-[10px] font-bold text-emerald-600 bg-emerald-50 px-2 py-1 rounded border border-emerald-200">ACTIVE</span>
                                <span th:unless="${account.isActive}" class="text-[10px] font-bold text-rose-600 bg-rose-50 px-2 py-1 rounded border border-rose-200">INACTIVE</span>
                            </td>
                            <td class="py-4 px-4 text-center">
                                <div class="flex items-center justify-center gap-2">
                                    <a th:href="@{/admin/accounts/edit/{id}(id=${account.id})}" class="text-primary-blue hover:text-blue-800 bg-blue-50 hover:bg-blue-100 p-1.5 rounded transition-colors" title="Edit">
                                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/></svg>
                                    </a>
                                    <form th:action="@{/admin/accounts/delete/{id}(id=${account.id})}" method="post" onsubmit="return confirm('Are you sure you want to delete this account?');" class="inline">
                                        <button type="submit" class="text-rose-400 hover:text-rose-600 bg-rose-50 hover:bg-rose-100 p-1.5 rounded transition-colors" title="Delete">
                                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(accounts)}">
                            <td colspan="5" class="py-8 text-center text-slate-500 font-medium">No accounts found.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
