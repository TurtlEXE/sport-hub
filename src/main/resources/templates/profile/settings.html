<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head>
    <title th:text="#{profile.title}">Profile Settings</title>
</head>
<body>
<main layout:fragment="content">
    <div class="min-h-screen bg-gradient-to-br from-slate-50 via-blue-50/30 to-slate-50">
        
        <!-- Hero Banner -->
        <div class="relative bg-gradient-to-r from-slate-900 via-blue-900 to-slate-900 overflow-hidden">
            <div class="absolute inset-0 opacity-20">
                <div class="absolute inset-0" style="background-image: url('data:image/svg+xml,%3Csvg width=&quot;60&quot; height=&quot;60&quot; viewBox=&quot;0 0 60 60&quot; xmlns=&quot;http://www.w3.org/2000/svg&quot;%3E%3Cg fill=&quot;none&quot; fill-rule=&quot;evenodd&quot;%3E%3Cg fill=&quot;%239C92AC&quot; fill-opacity=&quot;0.15&quot;%3E%3Cpath d=&quot;M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z&quot;/%3E%3C/g%3E%3C/g%3E%3C/svg%3E');"></div>
            </div>
            <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-16 pb-24 relative">
                <h1 class="text-3xl font-black text-white tracking-tight" th:text="#{profile.title}">Profile Settings</h1>
                <p class="text-blue-200 text-sm mt-2 font-medium" th:text="#{profile.subtitle}">Manage your account information</p>
            </div>
        </div>

        <!-- Main Content -->
        <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 -mt-12 pb-16 relative z-10">
            
            <!-- Navigation Tabs -->
            <div class="bg-white/90 backdrop-blur-xl rounded-2xl shadow-lg shadow-slate-200/50 border border-white/60 p-2 mb-6 flex flex-wrap gap-2">
                <a th:href="@{/profile/settings}" 
                   class="flex items-center gap-2.5 px-5 py-3 rounded-xl text-sm font-bold text-white bg-gradient-to-r from-primary-blue to-blue-600 shadow-md shadow-blue-500/20 transition-all">
                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                    <span>Thông tin cá nhân</span>
                </a>
                <a th:href="@{/profile/bookings}" 
                   class="flex items-center gap-2.5 px-5 py-3 rounded-xl text-sm font-bold text-slate-600 hover:text-primary-blue hover:bg-slate-50 transition-all">
                    <svg class="w-5 h-5 opacity-70" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                    <span>Lịch sử đặt sân (My Bookings)</span>
                </a>
            </div>

            <!-- Avatar Card -->
            <div class="bg-white/80 backdrop-blur-xl rounded-2xl shadow-lg shadow-slate-200/50 border border-white/50 p-6 mb-6">
                <div class="flex flex-col sm:flex-row items-center gap-6">
                    <!-- Avatar -->
                    <div class="relative group" id="avatar-container">
                        <div class="w-28 h-28 rounded-2xl overflow-hidden bg-gradient-to-br from-blue-100 to-blue-200 shadow-lg shadow-blue-100/50 border-4 border-white">
                            <img id="avatar-preview" 
                                 src="" 
                                 alt="Avatar" 
                                 class="w-full h-full object-cover hidden">
                            <div id="avatar-placeholder" class="w-full h-full flex items-center justify-center">
                                <span id="avatar-initial" class="text-4xl font-black text-primary-blue uppercase">U</span>
                            </div>
                        </div>
                        <!-- Hover overlay -->
                        <label for="avatar-input" class="absolute inset-0 rounded-2xl bg-black/40 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-all duration-300 cursor-pointer">
                            <div class="text-center">
                                <svg class="w-6 h-6 text-white mx-auto mb-1" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                                <span class="text-white text-xs font-semibold" th:text="#{profile.avatar.change}">Change</span>
                            </div>
                        </label>
                        <input type="file" id="avatar-input" accept="image/jpeg,image/png,image/webp" class="hidden">
                    </div>
                    
                    <!-- User Info -->
                    <div class="text-center sm:text-left flex-1">
                        <h2 id="display-name" class="text-xl font-bold text-slate-900">User Name</h2>
                        <p id="display-email" class="text-sm text-slate-500 mt-1">email@example.com</p>
                        <span id="display-role" class="inline-block mt-2 px-3 py-1 bg-blue-50 text-primary-blue text-xs font-bold rounded-full uppercase tracking-wider">CUSTOMER</span>
                    </div>
                    
                    <!-- Upload Progress -->
                    <div id="upload-progress" class="hidden">
                        <div class="flex items-center gap-2">
                            <svg class="animate-spin w-5 h-5 text-primary-blue" fill="none" viewBox="0 0 24 24">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                            </svg>
                            <span class="text-sm font-semibold text-primary-blue" th:text="#{profile.avatar.uploading}">Uploading...</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Profile Form Card -->
            <div class="bg-white/80 backdrop-blur-xl rounded-2xl shadow-lg shadow-slate-200/50 border border-white/50 p-6 sm:p-8 mb-6">
                <h3 class="text-lg font-bold text-slate-900 mb-6 flex items-center gap-2">
                    <svg class="w-5 h-5 text-primary-blue" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                    <span th:text="#{profile.personalInfo}">Personal Information</span>
                </h3>
                
                <form id="profile-form" class="space-y-5">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                        <!-- Full Name -->
                        <div>
                            <label for="fullName" class="block text-sm font-semibold text-slate-700 mb-2" th:text="#{profile.fullName}">Full Name</label>
                            <input type="text" id="fullName" name="fullName" 
                                   class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-primary-blue/20 focus:border-primary-blue transition-all text-sm font-medium"
                                   required>
                        </div>
                        
                        <!-- Phone -->
                        <div>
                            <label for="phone" class="block text-sm font-semibold text-slate-700 mb-2" th:text="#{profile.phone}">Phone Number</label>
                            <input type="text" id="phone" name="phone"
                                   class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-primary-blue/20 focus:border-primary-blue transition-all text-sm font-medium">
                        </div>
                    </div>
                    
                    <!-- Email (read-only) -->
                    <div>
                        <label for="email" class="block text-sm font-semibold text-slate-700 mb-2" th:text="#{profile.email}">Email</label>
                        <input type="email" id="email" name="email" readonly
                               class="w-full px-4 py-3 bg-slate-100 border border-slate-200 rounded-xl text-sm font-medium text-slate-500 cursor-not-allowed">
                    </div>

                    <!-- Save Button -->
                    <div class="flex justify-end pt-2">
                        <button type="submit" id="btn-save-profile"
                                class="px-8 py-3 bg-slate-900 hover:bg-primary-blue text-white text-sm font-bold rounded-xl transition-all shadow-md shadow-slate-900/10 hover:shadow-primary-blue/25 hover:-translate-y-0.5 flex items-center gap-2">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                            <span th:text="#{profile.save}">Save Changes</span>
                        </button>
                    </div>
                </form>
            </div>

            <!-- Change Password Card -->
            <div id="password-section" class="bg-white/80 backdrop-blur-xl rounded-2xl shadow-lg shadow-slate-200/50 border border-white/50 overflow-hidden mb-6">
                <button id="toggle-password" class="w-full p-6 sm:p-8 flex items-center justify-between cursor-pointer hover:bg-slate-50/50 transition-colors">
                    <h3 class="text-lg font-bold text-slate-900 flex items-center gap-2">
                        <svg class="w-5 h-5 text-amber-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                        <span th:text="#{profile.password.change}">Change Password</span>
                    </h3>
                    <svg id="chevron-icon" class="w-5 h-5 text-slate-400 transition-transform duration-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                    </svg>
                </button>
                
                <div id="password-form-container" class="hidden px-6 sm:px-8 pb-6 sm:pb-8">
                    <form id="password-form" class="space-y-5 pt-2 border-t border-slate-100">
                        <div class="pt-4 space-y-5">
                            <div>
                                <label for="currentPassword" class="block text-sm font-semibold text-slate-700 mb-2" th:text="#{profile.password.current}">Current Password</label>
                                <input type="password" id="currentPassword" name="currentPassword" required
                                       class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-primary-blue/20 focus:border-primary-blue transition-all text-sm font-medium">
                            </div>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                                <div>
                                    <label for="newPassword" class="block text-sm font-semibold text-slate-700 mb-2" th:text="#{profile.password.new}">New Password</label>
                                    <input type="password" id="newPassword" name="newPassword" required minlength="6"
                                           class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-primary-blue/20 focus:border-primary-blue transition-all text-sm font-medium">
                                </div>
                                <div>
                                    <label for="confirmPassword" class="block text-sm font-semibold text-slate-700 mb-2" th:text="#{profile.password.confirm}">Confirm New Password</label>
                                    <input type="password" id="confirmPassword" name="confirmPassword" required
                                           class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-primary-blue/20 focus:border-primary-blue transition-all text-sm font-medium">
                                </div>
                            </div>
                        </div>
                        <div class="flex justify-end">
                            <button type="submit" id="btn-change-password"
                                    class="px-8 py-3 bg-amber-500 hover:bg-amber-600 text-white text-sm font-bold rounded-xl transition-all shadow-md shadow-amber-500/10 hover:shadow-amber-500/25 hover:-translate-y-0.5 flex items-center gap-2">
                                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                                <span th:text="#{profile.password.save}">Update Password</span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-6 right-6 z-50 hidden transform transition-all duration-300 translate-y-2 opacity-0">
        <div class="flex items-center gap-3 px-5 py-4 rounded-xl shadow-lg border max-w-sm">
            <span id="toast-icon"></span>
            <span id="toast-message" class="text-sm font-semibold"></span>
        </div>
    </div>
</main>

<th:block layout:fragment="pageScripts">
    <script th:src="@{/js/profile.js}"></script>
</th:block>
</body>
</html>
