<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" layout:decorate="~{dashboard-layout}">
<head>
    <title th:text="#{profile.title}">Profile Settings</title>
</head>
<body>

<!-- Sidebar Menu -->
<div layout:fragment="sidebar-menu" class="py-6 px-4 space-y-2">
    <a th:href="@{/profile/settings}" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-semibold text-white bg-white/10">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
        <span th:text="#{profile.title}">Profile Settings</span>
    </a>
</div>

<!-- Header Title -->
<div layout:fragment="header-title" class="flex-1">
    <h1 class="text-xl font-bold text-slate-900" th:text="#{profile.title}">Profile Settings</h1>
    <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider" th:text="#{profile.subtitle}">Manage your account</p>
</div>

<!-- Content -->
<div layout:fragment="content">
    <div class="max-w-4xl mx-auto space-y-6">
        
        <!-- Avatar Card -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6">
            <div class="flex flex-col sm:flex-row items-center gap-6">
                <!-- Avatar -->
                <div class="relative group" id="avatar-container">
                    <div class="w-24 h-24 rounded-2xl overflow-hidden bg-gradient-to-br from-blue-100 to-blue-200 shadow-md border-4 border-white">
                        <img id="avatar-preview" src="" alt="Avatar" class="w-full h-full object-cover hidden">
                        <div id="avatar-placeholder" class="w-full h-full flex items-center justify-center">
                            <span id="avatar-initial" class="text-3xl font-black text-primary-blue uppercase">U</span>
                        </div>
                    </div>
                    <label for="avatar-input" class="absolute inset-0 rounded-2xl bg-black/40 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-all duration-300 cursor-pointer">
                        <div class="text-center">
                            <svg class="w-5 h-5 text-white mx-auto mb-1" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                            <span class="text-white text-xs font-semibold" th:text="#{profile.avatar.change}">Change</span>
                        </div>
                    </label>
                    <input type="file" id="avatar-input" accept="image/jpeg,image/png,image/webp" class="hidden">
                </div>
                
                <!-- User Info -->
                <div class="text-center sm:text-left flex-1">
                    <h2 id="display-name" class="text-lg font-bold text-slate-900">User Name</h2>
                    <p id="display-email" class="text-sm text-slate-500 mt-1">email@example.com</p>
                    <span id="display-role" class="inline-block mt-2 px-3 py-1 bg-blue-50 text-primary-blue text-xs font-bold rounded-full uppercase tracking-wider">ROLE</span>
                </div>
                
                <!-- Upload Progress -->
                <div id="upload-progress" class="hidden">
                    <div class="flex items-center gap-2">
                        <svg class="animate-spin w-5 h-5 text-primary-blue" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                        <span class="text-sm font-semibold text-primary-blue" th:text="#{profile.avatar.uploading}">Uploading...</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Profile Form Card -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6 sm:p-8">
            <h3 class="text-lg font-bold text-slate-900 mb-6 flex items-center gap-2">
                <svg class="w-5 h-5 text-primary-blue" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                <span th:text="#{profile.personalInfo}">Personal Information</span>
            </h3>
            
            <form id="profile-form" class="space-y-5">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                    <div>
                        <label for="fullName" class="block text-sm font-semibold text-slate-700 mb-2" th:text="#{profile.fullName}">Full Name</label>
                        <input type="text" id="fullName" name="fullName" required
                               class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-primary-blue/20 focus:border-primary-blue transition-all text-sm font-medium">
                    </div>
                    <div>
                        <label for="phone" class="block text-sm font-semibold text-slate-700 mb-2" th:text="#{profile.phone}">Phone Number</label>
                        <input type="text" id="phone" name="phone"
                               class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-primary-blue/20 focus:border-primary-blue transition-all text-sm font-medium">
                    </div>
                </div>
                <div>
                    <label for="email" class="block text-sm font-semibold text-slate-700 mb-2" th:text="#{profile.email}">Email</label>
                    <input type="email" id="email" name="email" readonly
                           class="w-full px-4 py-3 bg-slate-100 border border-slate-200 rounded-xl text-sm font-medium text-slate-500 cursor-not-allowed">
                </div>
                <div class="flex justify-end pt-2">
                    <button type="submit" id="btn-save-profile"
                            class="px-8 py-3 bg-primary-blue hover:bg-blue-700 text-white text-sm font-bold rounded-xl transition-all shadow-md shadow-blue-500/10 hover:shadow-blue-500/25 hover:-translate-y-0.5 flex items-center gap-2">
                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                        <span th:text="#{profile.save}">Save Changes</span>
                    </button>
                </div>
            </form>
        </div>

        <!-- Owner Business Info (only visible for OWNER role) -->
        <div id="owner-section" class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6 sm:p-8 hidden">
            <h3 class="text-lg font-bold text-slate-900 mb-6 flex items-center gap-2">
                <svg class="w-5 h-5 text-emerald-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>
                <span th:text="#{profile.owner.business}">Business Information</span>
            </h3>
            
            <form id="owner-form" class="space-y-5">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                    <div class="sm:col-span-2">
                        <label for="businessName" class="block text-sm font-semibold text-slate-700 mb-2" th:text="#{profile.owner.businessName}">Business Name</label>
                        <input type="text" id="businessName" name="businessName" required
                               class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all text-sm font-medium">
                    </div>
                    <div>
                        <label for="taxCode" class="block text-sm font-semibold text-slate-700 mb-2" th:text="#{profile.owner.taxCode}">Tax Code</label>
                        <input type="text" id="taxCode" name="taxCode"
                               class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all text-sm font-medium">
                    </div>
                    <div>
                        <label for="bankName" class="block text-sm font-semibold text-slate-700 mb-2" th:text="#{profile.owner.bankName}">Bank Name</label>
                        <input type="text" id="bankName" name="bankName"
                               class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all text-sm font-medium">
                    </div>
                    <div>
                        <label for="bankAccountNo" class="block text-sm font-semibold text-slate-700 mb-2" th:text="#{profile.owner.bankAccountNo}">Bank Account Number</label>
                        <input type="text" id="bankAccountNo" name="bankAccountNo"
                               class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all text-sm font-medium">
                    </div>
                    <div>
                        <label for="bankAccountName" class="block text-sm font-semibold text-slate-700 mb-2" th:text="#{profile.owner.bankAccountName}">Account Holder Name</label>
                        <input type="text" id="bankAccountName" name="bankAccountName"
                               class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all text-sm font-medium">
                    </div>
                </div>
                <div class="flex justify-end pt-2">
                    <button type="submit" id="btn-save-owner"
                            class="px-8 py-3 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-bold rounded-xl transition-all shadow-md shadow-emerald-500/10 hover:shadow-emerald-500/25 hover:-translate-y-0.5 flex items-center gap-2">
                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                        <span th:text="#{profile.save}">Save Changes</span>
                    </button>
                </div>
            </form>
        </div>

        <!-- Change Password -->
        <div id="password-section" class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
            <button id="toggle-password" class="w-full p-6 sm:p-8 flex items-center justify-between cursor-pointer hover:bg-slate-50/50 transition-colors">
                <h3 class="text-lg font-bold text-slate-900 flex items-center gap-2">
                    <svg class="w-5 h-5 text-amber-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                    <span th:text="#{profile.password.change}">Change Password</span>
                </h3>
                <svg id="chevron-icon" class="w-5 h-5 text-slate-400 transition-transform duration-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                </svg>
            </button>
            
            <div id="password-form-container" class="hidden px-6 sm:px-8 pb-6 sm:pb-8">
                <form id="password-form" class="space-y-5 pt-2 border-t border-slate-100">
                    <div class="pt-4 space-y-5">
                        <div>
                            <label for="currentPassword" class="block text-sm font-semibold text-slate-700 mb-2" th:text="#{profile.password.current}">Current Password</label>
                            <input type="password" id="currentPassword" name="currentPassword" required
                                   class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-primary-blue/20 focus:border-primary-blue transition-all text-sm font-medium">
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                            <div>
                                <label for="newPassword" class="block text-sm font-semibold text-slate-700 mb-2" th:text="#{profile.password.new}">New Password</label>
                                <input type="password" id="newPassword" name="newPassword" required minlength="6"
                                       class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-primary-blue/20 focus:border-primary-blue transition-all text-sm font-medium">
                            </div>
                            <div>
                                <label for="confirmPassword" class="block text-sm font-semibold text-slate-700 mb-2" th:text="#{profile.password.confirm}">Confirm New Password</label>
                                <input type="password" id="confirmPassword" name="confirmPassword" required
                                       class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-primary-blue/20 focus:border-primary-blue transition-all text-sm font-medium">
                            </div>
                        </div>
                    </div>
                    <div class="flex justify-end">
                        <button type="submit" id="btn-change-password"
                                class="px-8 py-3 bg-amber-500 hover:bg-amber-600 text-white text-sm font-bold rounded-xl transition-all shadow-md shadow-amber-500/10 hover:shadow-amber-500/25 hover:-translate-y-0.5 flex items-center gap-2">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                            <span th:text="#{profile.password.save}">Update Password</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    
    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-6 right-6 z-50 hidden transform transition-all duration-300 translate-y-2 opacity-0">
        <div class="flex items-center gap-3 px-5 py-4 rounded-xl shadow-lg border max-w-sm">
            <span id="toast-icon"></span>
            <span id="toast-message" class="text-sm font-semibold"></span>
        </div>
    </div>
</div>

<th:block layout:fragment="pageScripts">
    <script th:src="@{/js/profile.js}"></script>
</th:block>
</body>
</html>
