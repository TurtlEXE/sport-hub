<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head>
    <title>Venues - SportHub</title>
</head>
<body>

<main layout:fragment="content" class="py-8 bg-slate-50 min-h-screen">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        
        <div class="flex flex-col lg:flex-row gap-8">
            
            <!-- Sidebar Filters -->
            <div class="w-full lg:w-1/4 flex-shrink-0">
                <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 sticky top-28">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-sm font-bold text-slate-800 tracking-wider flex items-center gap-2">
                            <svg class="w-4 h-4 text-primary-blue" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z" />
                            </svg>
                            SEARCH FILTERS
                        </h2>
                        <button class="text-xs font-semibold text-slate-400 hover:text-primary-blue transition-colors">Clear all</button>
                    </div>

                    <!-- Keyword Search -->
                    <div class="mb-8">
                        <label class="block text-xs font-bold text-slate-500 mb-2 uppercase tracking-wider">KEYWORD / VENUE NAME</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <svg class="h-4 w-4 text-slate-400" viewBox="0 0 20 20" fill="currentColor">
                                    <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd" />
                                </svg>
                            </div>
                            <input type="text" class="block w-full pl-10 pr-3 py-2.5 border border-slate-200 rounded-xl leading-5 bg-slate-50 placeholder-slate-400 focus:outline-none focus:bg-white focus:ring-2 focus:ring-primary-blue focus:border-primary-blue sm:text-sm transition-all" placeholder="Search by venue name, address">
                        </div>
                    </div>

                    <!-- Sport Categories -->
                    <div class="mb-8">
                        <label class="block text-xs font-bold text-slate-500 mb-3 uppercase tracking-wider">SPORT CATEGORIES</label>
                        <div class="space-y-1">
                            <!-- All Sports Option -->
                            <label class="flex items-center justify-between p-2.5 rounded-xl bg-blue-50/50 border border-blue-100 cursor-pointer group">
                                <div class="flex items-center gap-3">
                                    <div class="w-8 h-8 rounded-full bg-white flex items-center justify-center text-lg shadow-sm">
                                        🎯
                                    </div>
                                    <span class="text-sm font-bold text-primary-blue">All Sports</span>
                                </div>
                                <svg class="w-5 h-5 text-primary-blue" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                                </svg>
                            </label>

                            <!-- Dynamic Sports Options -->
                            <label th:each="sport : ${sports}" class="flex items-center justify-between p-2.5 rounded-xl hover:bg-slate-50 border border-transparent hover:border-slate-100 cursor-pointer group transition-all">
                                <div class="flex items-center gap-3">
                                    <div class="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-lg group-hover:bg-white group-hover:shadow-sm transition-all">
                                        <span th:if="${sport.sportCode == 'FOOTBALL'}">⚽</span>
                                        <span th:if="${sport.sportCode == 'BADMINTON'}">🏸</span>
                                        <span th:if="${sport.sportCode == 'TENNIS'}">🎾</span>
                                        <span th:if="${sport.sportCode == 'BASKETBALL'}">🏀</span>
                                        <span th:if="${sport.sportCode == 'PICKLEBALL'}">🏓</span>
                                        <span th:if="${sport.sportCode != 'FOOTBALL' && sport.sportCode != 'BADMINTON' && sport.sportCode != 'TENNIS' && sport.sportCode != 'BASKETBALL' && sport.sportCode != 'PICKLEBALL'}">🏆</span>
                                    </div>
                                    <span class="text-sm font-medium text-slate-600 group-hover:text-slate-900" th:text="${sport.sportName}">Sport Name</span>
                                </div>
                            </label>
                        </div>
                    </div>

                    <!-- Price Range -->
                    <div class="mb-8">
                        <div class="flex justify-between items-end mb-4">
                            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider">PRICE PER HOUR</label>
                            <span class="text-sm font-bold text-slate-900">$80/h</span>
                        </div>
                        <input type="range" min="15" max="100" value="80" class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-primary-blue">
                        <div class="flex justify-between mt-2">
                            <span class="text-xs font-medium text-slate-400">Min: $15</span>
                            <span class="text-xs font-medium text-slate-400">Max: $100</span>
                        </div>
                    </div>

                    <!-- Venue Amenities -->
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-3 uppercase tracking-wider">VENUE AMENITIES</label>
                        <div class="space-y-3">
                            <label class="flex items-center gap-3 cursor-pointer group">
                                <input type="checkbox" class="w-4 h-4 text-primary-blue border-slate-300 rounded focus:ring-primary-blue focus:ring-2">
                                <span class="text-sm font-medium text-slate-600 group-hover:text-slate-900 transition-colors flex items-center gap-2">
                                    <span class="text-lg">💡</span> Night floodlights
                                </span>
                            </label>
                            <label class="flex items-center gap-3 cursor-pointer group">
                                <input type="checkbox" class="w-4 h-4 text-primary-blue border-slate-300 rounded focus:ring-primary-blue focus:ring-2">
                                <span class="text-sm font-medium text-slate-600 group-hover:text-slate-900 transition-colors flex items-center gap-2">
                                    <span class="text-lg">🚪</span> Locker rooms
                                </span>
                            </label>
                            <label class="flex items-center gap-3 cursor-pointer group">
                                <input type="checkbox" class="w-4 h-4 text-primary-blue border-slate-300 rounded focus:ring-primary-blue focus:ring-2">
                                <span class="text-sm font-medium text-slate-600 group-hover:text-slate-900 transition-colors flex items-center gap-2">
                                    <span class="text-lg">🚿</span> Hot shower
                                </span>
                            </label>
                            <label class="flex items-center gap-3 cursor-pointer group">
                                <input type="checkbox" class="w-4 h-4 text-primary-blue border-slate-300 rounded focus:ring-primary-blue focus:ring-2">
                                <span class="text-sm font-medium text-slate-600 group-hover:text-slate-900 transition-colors flex items-center gap-2">
                                    <span class="text-lg">🅿️</span> Free parking
                                </span>
                            </label>
                            <label class="flex items-center gap-3 cursor-pointer group">
                                <input type="checkbox" class="w-4 h-4 text-primary-blue border-slate-300 rounded focus:ring-primary-blue focus:ring-2">
                                <span class="text-sm font-medium text-slate-600 group-hover:text-slate-900 transition-colors flex items-center gap-2">
                                    <span class="text-lg">🎾</span> Equipment rental
                                </span>
                            </label>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Venues Grid -->
            <div class="w-full lg:w-3/4">
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    
                    <!-- Venue Card -->
                    <div th:each="venue : ${venues}" class="bg-white rounded-2xl overflow-hidden shadow-sm hover:shadow-xl transition-all duration-300 border border-slate-100 group venue-card"
                         th:data-lat="${venue.latitude}" th:data-lng="${venue.longitude}">
                        
                        <!-- Image Container -->
                        <div class="relative h-48 overflow-hidden">
                            <img th:src="${venue.imageUrl}" alt="Venue Image" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                            
                            <!-- Badges Top Left -->
                            <div class="absolute top-3 left-3 flex gap-2">
                                <span class="bg-secondary-green/90 backdrop-blur-sm text-white text-[10px] font-bold px-2 py-1 rounded uppercase tracking-wider">Daily</span>
                                <span class="bg-purple-500/90 backdrop-blur-sm text-white text-[10px] font-bold px-2 py-1 rounded uppercase tracking-wider">Event</span>
                            </div>

                            <!-- Favorite Button Top Right -->
                            <button class="absolute top-3 right-3 w-8 h-8 bg-white/80 backdrop-blur-sm rounded-full flex items-center justify-center text-slate-400 hover:text-rose-500 hover:bg-white transition-all shadow-sm">
                                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                                    <path fill-rule="evenodd" d="M3.172 5.172a4 4 0 015.656 0L10 6.343l1.172-1.171a4 4 0 115.656 5.656L10 17.657l-6.828-6.829a4 4 0 010-5.656z" clip-rule="evenodd" />
                                </svg>
                            </button>

                            <!-- Bottom Badges -->
                            <div class="absolute bottom-3 left-3 flex gap-2">
                                <span th:each="sport : ${venue.sports}" class="bg-white/90 backdrop-blur-sm text-slate-800 text-xs font-bold px-2.5 py-1 rounded shadow-sm flex items-center gap-1">
                                    <span th:if="${sport == 'BASKETBALL'}" class="text-[10px] text-accent-orange">●</span>
                                    <span th:if="${sport == 'PICKLEBALL'}" class="text-[10px] text-rose-500">●</span>
                                    <span th:if="${sport == 'BADMINTON'}" class="text-[10px] text-primary-blue">●</span>
                                    <span th:if="${sport == 'TENNIS'}" class="text-[10px] text-secondary-green">●</span>
                                    <span th:if="${sport == 'FOOTBALL'}" class="text-[10px] text-slate-800">●</span>
                                    <span th:text="${sport}">SPORT</span>
                                </span>
                            </div>
                            
                            <!-- Distance Badge -->
                            <div class="absolute bottom-3 right-3">
                                <span class="bg-slate-900/80 backdrop-blur-sm text-white text-xs font-bold px-2.5 py-1 rounded shadow-sm distance-label">
                                    -- km
                                </span>
                            </div>
                        </div>

                        <!-- Card Content -->
                        <div class="p-5">
                            <h3 class="text-lg font-bold text-slate-900 mb-1 line-clamp-1" th:text="${venue.name}">Venue Name</h3>
                            
                            <!-- Rating -->
                            <div class="flex items-center gap-2 mb-3">
                                <div class="flex items-center text-amber-400">
                                    <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path></svg>
                                </div>
                                <span class="text-sm font-bold text-slate-700" th:text="${venue.rating}">4.5</span>
                                <span class="text-xs font-medium text-slate-400" th:text="'• ' + ${venue.reviewCount} + ' Reviews'">• 100 Reviews</span>
                            </div>

                            <!-- Address -->
                            <div class="flex items-start gap-2 mb-2">
                                <svg class="w-4 h-4 text-slate-400 mt-0.5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                                </svg>
                                <span class="text-sm text-slate-500 line-clamp-1" th:text="${venue.address}">Address</span>
                            </div>

                            <!-- Opening Hours -->
                            <div class="flex items-center gap-2 mb-4 pb-4 border-b border-slate-100">
                                <svg class="w-4 h-4 text-slate-400 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                                </svg>
                                <span class="text-xs text-slate-500">Opening hours: <strong class="text-slate-700" th:text="${venue.openingHours}">05:00 - 23:00</strong></span>
                            </div>

                            <!-- Amenities small tags -->
                            <div class="flex items-center gap-2 mb-5">
                                <span th:each="amenity, stat : ${venue.amenities}" th:if="${stat.index < 2}" class="text-[10px] font-bold text-secondary-green bg-green-50 px-2 py-1 rounded flex items-center gap-1">
                                    <span th:if="${amenity == 'Locker'}">✨</span>
                                    <span th:if="${amenity == 'Parking'}">🚗</span>
                                    <span th:text="${amenity}">Amenity</span>
                                </span>
                                <span th:if="${venue.amenities.size() > 2}" class="text-[10px] font-bold text-slate-500 bg-slate-100 px-2 py-1 rounded" th:text="'+' + ${venue.amenities.size() - 2} + ' amenities'">+2 amenities</span>
                            </div>

                            <!-- Price and Action -->
                            <div class="flex items-center justify-between mt-auto">
                                <div>
                                    <div class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-0.5">PRICE PER HOUR</div>
                                    <div class="flex items-baseline gap-1">
                                        <span class="text-xl font-black text-slate-900" th:text="'$' + ${venue.minPricePerHour}">$60</span>
                                        <span class="text-xs font-bold text-slate-400">/hour</span>
                                    </div>
                                </div>
                                <a th:href="@{/venues/{id}(id=${venue.facilityId})}" class="bg-slate-900 hover:bg-primary-blue text-white text-xs font-bold px-4 py-2.5 rounded-xl transition-all shadow-md hover:shadow-primary-blue/30 flex items-center gap-1">
                                    BOOK NOW
                                    <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                                </a>
                            </div>
                        </div>
                    </div>
                    <!-- End Venue Card -->

                </div>
            </div>
            
        </div>
    </div>
</main>

<th:block layout:fragment="pageScripts">
    <script>
        // Geolocation Script to Calculate Distance
        document.addEventListener('DOMContentLoaded', function() {
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(function(position) {
                    const userLat = position.coords.latitude;
                    const userLng = position.coords.longitude;
                    
                    const cards = document.querySelectorAll('.venue-card');
                    cards.forEach(card => {
                        const venueLat = parseFloat(card.getAttribute('data-lat'));
                        const venueLng = parseFloat(card.getAttribute('data-lng'));
                        const label = card.querySelector('.distance-label');
                        
                        if (!isNaN(venueLat) && !isNaN(venueLng)) {
                            const distance = calculateDistance(userLat, userLng, venueLat, venueLng);
                            if(distance !== null) {
                                label.innerHTML = distance.toFixed(1) + ' km';
                            }
                        }
                    });
                }, function(error) {
                    console.log("Error obtaining location: ", error);
                    // Fallback to default or mock distance if location is denied
                    mockDistances();
                });
            } else {
                console.log("Geolocation is not supported by this browser.");
                mockDistances();
            }
        });

        // Haversine formula to calculate distance in km
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; // Radius of the earth in km
            const dLat = deg2rad(lat2 - lat1);
            const dLon = deg2rad(lon2 - lon1);
            const a = 
                Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(deg2rad(lat1)) * Math.cos(deg2rad(lat2)) * 
                Math.sin(dLon / 2) * Math.sin(dLon / 2)
            ; 
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)); 
            const d = R * c; // Distance in km
            return d;
        }

        function deg2rad(deg) {
            return deg * (Math.PI / 180);
        }
        
        function mockDistances() {
             const cards = document.querySelectorAll('.venue-card');
             cards.forEach(card => {
                 const label = card.querySelector('.distance-label');
                 const randomDist = (Math.random() * 5 + 0.5).toFixed(1);
                 label.innerHTML = randomDist + ' km';
             });
        }
    </script>
</th:block>

</body>
</html>
