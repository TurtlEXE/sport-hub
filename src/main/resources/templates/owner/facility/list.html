<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{dashboard-layout}">

<head>
    <title th:text="#{facility.management.title}">Cơ sở của tôi</title>
    <style>
        .filter-btn.active {
            background-color: #2563eb;
            color: white;
        }

        .filter-btn:not(.active) {
            color: #4b5563;
        }

        .filter-btn:not(.active):hover {
            color: #111827;
        }
    </style>
</head>

<body>
    <!-- Sidebar Menu Injection -->
    <div layout:fragment="sidebar-menu" th:replace="~{owner/fragments/sidebar :: sidebar('facilities')}"></div>

    <!-- Header Title -->
    <div layout:fragment="header-title" class="flex-1">
        <h1 class="text-xl font-bold text-slate-900" th:text="#{facility.management.title}">Quản lý Cơ sở Thể thao</h1>
        <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-0.5">OWNER DASHBOARD • FACILITY
            MANAGEMENT</p>
    </div>

    <!-- Main Content -->
    <div layout:fragment="content">
        <div class="container mx-auto px-4 py-6">

            <!-- Stats Row -->
            <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
                <!-- Total -->
                <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5 flex items-center justify-between">
                    <div>
                        <p class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1"
                            th:text="#{facility.list.total}">TỔNG SỐ CƠ SỞ</p>
                        <h2 class="text-2xl font-bold text-gray-900" id="statTotalFacilities">0</h2>
                    </div>
                    <div class="w-10 h-10 rounded-lg bg-blue-50 text-blue-500 flex items-center justify-center">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4">
                            </path>
                        </svg>
                    </div>
                </div>
                <!-- Approved -->
                <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5 flex items-center justify-between">
                    <div>
                        <p class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1"
                            th:text="#{facility.list.approved}">ĐÃ PHÊ DUYỆT</p>
                        <h2 class="text-2xl font-bold text-green-600" id="statApproved">0</h2>
                    </div>
                    <div
                        class="w-10 h-10 rounded-lg border-2 border-green-500 text-green-500 flex items-center justify-center">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7">
                            </path>
                        </svg>
                    </div>
                </div>
                <!-- Pending -->
                <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5 flex items-center justify-between">
                    <div>
                        <p class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1"
                            th:text="#{facility.list.pending}">ĐANG CHỜ DUYỆT</p>
                        <h2 class="text-2xl font-bold text-orange-500" id="statPending">0</h2>
                    </div>
                    <div class="w-10 h-10 rounded-full bg-orange-50 text-orange-500 flex items-center justify-center">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                    </div>
                </div>
                <!-- Sports & Courts -->
                <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5 flex items-center justify-between">
                    <div>
                        <p class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1"
                            th:text="#{facility.list.sports.courts}">MÔN & SÂN BÓNG</p>
                        <h2 class="text-lg font-bold text-gray-900 mt-1"><span id="statSports">0</span> <span
                                th:text="#{facility.list.sports.label}">Môn</span> &bull; <span id="statCourts">0</span>
                            <span th:text="#{facility.list.courts.label}">Sân</span></h2>
                    </div>
                    <div class="w-10 h-10 rounded-lg bg-indigo-50 text-indigo-500 flex items-center justify-center">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10">
                            </path>
                        </svg>
                    </div>
                </div>
            </div>

            <!-- Filter & Action Bar -->
            <div
                class="flex flex-col md:flex-row justify-between items-center mb-8 bg-white p-3 rounded-2xl shadow-sm border border-gray-100">
                <div class="flex space-x-2">
                    <button class="filter-btn active px-4 py-2 rounded-xl text-sm font-semibold transition-colors"
                        data-status="ALL">
                        <span th:text="#{facility.list.filter.all}">Tất cả</span> (<span id="countAll">0</span>)
                    </button>
                    <button class="filter-btn px-4 py-2 rounded-xl text-sm font-medium transition-colors"
                        data-status="PENDING">
                        <span th:text="#{facility.list.filter.pending}">Chờ duyệt</span> (<span
                            id="countPending">0</span>)
                    </button>
                    <button class="filter-btn px-4 py-2 rounded-xl text-sm font-medium transition-colors"
                        data-status="APPROVED">
                        <span th:text="#{facility.list.filter.approved}">Đã duyệt</span> (<span
                            id="countApproved">0</span>)
                    </button>
                    <button class="filter-btn px-4 py-2 rounded-xl text-sm font-medium transition-colors"
                        data-status="REJECTED">
                        <span th:text="#{facility.list.filter.rejected}">Bị từ chối</span> (<span
                            id="countRejected">0</span>)
                    </button>
                </div>
                <div class="mt-4 md:mt-0">
                    <a href="/owner/facilities/create"
                        class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 px-5 rounded-xl shadow-sm transition duration-150 ease-in-out flex items-center text-sm">
                        <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4">
                            </path>
                        </svg>
                        <span th:text="#{facility.list.btn.create}">+ Tạo cơ sở mới</span>
                    </a>
                </div>
            </div>

            <!-- Empty State -->
            <div id="emptyState" class="hidden bg-white rounded-xl shadow-sm border border-gray-100 p-16 text-center">
                <svg class="mx-auto h-20 w-20 text-gray-200 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                        d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4">
                    </path>
                </svg>
                <h3 class="text-xl font-bold text-gray-900 mb-2" th:text="#{facility.list.empty.title}">Bạn chưa có cơ
                    sở nào</h3>
                <p class="text-gray-500 mb-6 text-sm" th:text="#{facility.list.empty.desc}">Hãy tạo cơ sở đầu tiên của
                    bạn để bắt đầu kinh doanh.</p>
                <a href="/owner/facilities/create"
                    class="inline-flex items-center bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 px-6 rounded-xl transition duration-150">
                    <span th:text="#{facility.list.empty.btn}">Tạo ngay</span>
                </a>
            </div>

            <!-- Facility Grid -->
            <div id="facilityGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Cards will be rendered here by JS -->
            </div>
        </div>
    </div>

    <th:block layout:fragment="pageScripts">
        <script th:inline="javascript">
            // Passing localized texts to JS
            const i18n = {
                statusActive: [[#{ facility.list.status.active }]],
                statusInactive: [[#{ facility.list.status.inactive }]],
                totalCourts: [[#{ facility.list.courts.total }]],
                totalSports: [[#{ facility.list.sports.total }]],
                businessSports: [[#{ facility.list.sports.business }]],
                manageDetail: [[#{ facility.list.manage_detail }]],
                createdDate: [[#{ facility.list.created_date }]],
                rejectionReason: [[#{ facility.list.rejection_reason }]],
                filterApproved: [[#{ facility.list.filter.approved }]],
                filterPending: [[#{ facility.list.filter.pending }]],
                filterRejected: [[#{ facility.list.filter.rejected }]],
                courtsLabel: [[#{ facility.list.courts.label }]],
                noSports: [[#{ facility.list.no_sports }]]
            };
        </script>
        <script th:src="@{/js/owner-facility-list.js}"></script>
    </th:block>

</html>
