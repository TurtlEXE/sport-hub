<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{dashboard-layout}">
<head>
    <title th:text="#{facility.management.title}">Quản lý Cơ sở Thể thao</title>
</head>
<body>
    <div layout:fragment="sidebar-menu" th:replace="~{owner/fragments/sidebar :: sidebar('facilities')}"></div>

    <div layout:fragment="header-title" class="flex-1">
        <h1 class="text-xl font-bold text-slate-900" th:text="#{facility.management.title}">Quản lý Cơ sở Thể thao</h1>
        <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-0.5">OWNER DASHBOARD • FACILITY MANAGEMENT</p>
    </div>

    <div layout:fragment="content">
        <div class="container mx-auto px-4 py-6">
            
            <!-- Top Actions -->
            <div class="mb-6 flex justify-between items-center">
                <a href="/owner/facilities" class="text-sm font-semibold text-gray-500 hover:text-gray-800 flex items-center transition">
                    <svg class="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                    <span th:text="#{facility.detail.back}">Quay lại danh sách</span>
                </a>
                <button onclick="renderEditGeneralInfoForm()" class="px-4 py-2 bg-blue-50 text-blue-600 rounded-xl text-sm font-bold flex items-center border border-blue-100 hover:bg-blue-100 transition shadow-sm">
                    <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                    <span th:text="#{facility.detail.edit}">Sửa thông tin chung</span>
                </button>
            </div>

            <!-- Modal Container -->
            <div id="editGeneralInfoModalContainer"></div>
            <div id="editGalleryModalContainer"></div>

            <!-- Pending Alert -->
            <div id="pendingAlert" class="hidden mb-8 bg-yellow-50/80 border border-yellow-200 rounded-2xl p-5 flex items-start gap-4">
                <div class="w-10 h-10 rounded-full bg-yellow-100 flex items-center justify-center text-yellow-600 flex-shrink-0">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                </div>
                <div>
                    <h3 class="font-bold text-yellow-800 text-sm" th:text="#{facility.detail.pending.title}">Cơ sở đang chờ phê duyệt</h3>
                    <p class="text-xs text-yellow-700 mt-1" th:text="#{facility.detail.pending.desc}">Thông tin đang được kiểm tra bởi Admin. Bạn vẫn có thể cấu hình chi tiết môn học, sân bóng và bảng giá sẵn ở phía dưới.</p>
                </div>
            </div>

            <!-- Main Info Cards -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-8">
                <!-- Overview Card -->
                <div id="overviewCard" class="lg:col-span-2 bg-white rounded-3xl p-7 shadow-sm border border-gray-100 flex flex-col justify-between h-full">
                    <!-- JS will render Title, Badge, Address, Description -->
                </div>
                <!-- Images Card -->
                <div id="imagesCard" class="bg-white rounded-3xl p-7 shadow-sm border border-gray-100 flex flex-col h-full">
                    <!-- JS will render Thumbnail -->
                </div>
            </div>

            <!-- Sport Tabs -->
            <div class="flex flex-col lg:flex-row lg:items-center justify-between mb-8 gap-4 border-b border-gray-100 pb-4">
                <div id="sportsTabsContainer" class="flex flex-wrap items-center gap-3">
                    <!-- JS will render pills for sports -->
                </div>
                <div id="sportStatusContainer" class="hidden flex items-center text-sm font-semibold text-gray-600">
                    <span th:text="#{facility.detail.sport_status}">Trạng thái môn:</span>
                    <div id="sportStatusBadge" class="ml-2 flex items-center gap-1.5 px-3 py-1.5 rounded-full border">
                        <!-- JS renders -->
                    </div>
                </div>
            </div>

            <!-- Active Sport Details -->
            <div id="sportDetailContent" class="space-y-12">
                <!-- JS will render Config, Courts, Pricing for the active sport -->
            </div>
            
        </div>
    </div>

        <script th:src="@{/js/owner-facility-detail.js}"></script>
    </th:block>
</html>
