<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{dashboard-layout}">

<head>
    <title>Owner Bookings</title>
    <!-- Flatpickr for DatePicker Modal -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    
    <style>
        .timeline-grid {
            display: grid;
            grid-template-columns: 120px repeat(var(--total-slots, 14), minmax(60px, 1fr));
            border-left: 1px solid #e2e8f0;
            border-top: 1px solid #e2e8f0;
            width: max-content;
            min-width: 100%;
        }

        .timeline-cell {
            border-right: 1px solid #e2e8f0;
            border-bottom: 1px solid #e2e8f0;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.875rem;
            position: relative;
            transition: all 0.2s;
        }

        .timeline-header {
            background-color: #f8fafc;
            font-weight: 600;
            color: #64748b;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .court-name {
            position: sticky;
            left: 0;
            background-color: #f8fafc;
            z-index: 20;
            font-weight: 600;
            color: #0f172a;
            padding: 0 12px;
            border-right: 2px solid #cbd5e1;
            justify-content: flex-start;
        }

        .slot-available {
            background-color: #ffffff;
            cursor: default;
        }

        .slot-available:hover {
            background-color: #eff6ff; /* Light Blue on hover */
        }

        .slot-hold {
            background-color: #fdba74; /* Orange for PENDING */
            position: relative;
        }

        .slot-hold:hover {
            background-color: #fb923c;
        }

        .slot-booked {
            background-color: #1e293b; /* Dark Blue / Navy for CONFIRMED */
            color: #fff;
            position: relative;
        }

        .slot-booked:hover {
            background-color: #0f172a;
        }

        .timeline-container::-webkit-scrollbar { height: 8px; }
        .timeline-container::-webkit-scrollbar-track { background: #f8fafc; border-radius: 4px; }
        .timeline-container::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 4px; }

        .chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8rem;
            font-weight: 500;
        }
        .chip-box { width: 14px; height: 14px; border-radius: 3px; }

        /* Tooltip Styles */
        .booking-tooltip {
            visibility: hidden;
            background-color: #fff;
            color: #1e293b;
            text-align: left;
            border-radius: 8px;
            padding: 8px 12px;
            position: absolute;
            z-index: 50;
            bottom: 110%;
            left: 50%;
            transform: translateX(-50%);
            opacity: 0;
            transition: opacity 0.3s;
            width: max-content;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.2);
            font-size: 0.75rem;
            line-height: 1.4;
            pointer-events: none;
            border: 1px solid #e2e8f0;
        }

        .booking-tooltip::after {
            content: "";
            position: absolute;
            top: 100%;
            left: 50%;
            margin-left: -5px;
            border-width: 5px;
            border-style: solid;
            border-color: #fff transparent transparent transparent;
        }

        .slot-hold:hover .booking-tooltip,
        .slot-booked:hover .booking-tooltip {
            visibility: visible;
            opacity: 1;
        }
        
        /* Folder Tabs Styling */
        .folder-tabs-wrapper {
            display: flex;
            align-items: flex-end;
            gap: 4px;
            margin-bottom: -1px;
            position: relative;
            z-index: 10;
            overflow-x: auto;
        }
        
        .folder-tabs-wrapper::-webkit-scrollbar { display: none; }
        
        .folder-tab {
            padding: 12px 24px;
            font-size: 0.875rem;
            font-weight: 600;
            border: 1px solid #e2e8f0;
            border-bottom: none;
            border-radius: 8px 8px 0 0;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            position: relative;
        }
        
        .folder-tab-active {
            background-color: #ffffff;
            color: #2563eb;
            /* Extra 1px padding bottom and negative margin to perfectly overlap the container border */
            padding-bottom: 13px;
            margin-bottom: -1px;
            border-bottom: 2px solid #ffffff; 
            z-index: 20;
        }
        
        .folder-tab-inactive {
            background-color: #f8fafc;
            color: #64748b;
            border-bottom: 1px solid #e2e8f0;
            z-index: 10;
        }
        
        .folder-tab-inactive:hover {
            background-color: #f1f5f9;
            color: #334155;
        }
        
        .folder-content {
            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            border-top-left-radius: 0;
            position: relative;
            z-index: 0;
        }

        .fs-tab, .fac-tab, .sport-tab { outline: none; }
    </style>
</head>

<body>
    <!-- Sidebar Menu -->
    <div layout:fragment="sidebar-menu" th:replace="~{owner/fragments/sidebar :: sidebar('bookings')}"></div>

    <!-- Header Title -->
    <div layout:fragment="header-title" class="flex-1">
        <h1 class="text-xl font-bold text-slate-900">My Bookings</h1>
        <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-0.5">OWNER DASHBOARD • BOOKING MANAGEMENT</p>
    </div>

    <!-- Main Content -->
    <div layout:fragment="content">
        <!-- Hidden Data Source -->
        <div id="fsData" class="hidden">
            <div th:each="fs : ${ownerFacilitySports}" 
                 class="fs-item"
                 th:data-fs-id="${fs.id}"
                 th:data-facility-id="${fs.facility.id}"
                 th:data-facility-name="${fs.facility.name}"
                 th:data-sport-id="${fs.sport.id}"
                 th:data-sport-name="${fs.sport.sportName}">
            </div>
        </div>

        <!-- Facility Folder Tabs -->
        <div id="facilityTabsContainer" class="folder-tabs-wrapper">
            <!-- Rendered by JS -->
        </div>

        <!-- Main Facility Content Box -->
        <div class="folder-content shadow-sm flex flex-col gap-6 p-6">
            
            <div class="flex justify-between items-center flex-wrap gap-4">
                <div>
                    <h2 class="text-lg font-bold text-slate-800">Booking Schedule</h2>
                    <p class="text-sm text-slate-500 mt-1">Manage and view all reservations for your facilities.</p>
                </div>
                
                <div class="flex items-center gap-3">
                    <button class="p-2 border border-slate-200 rounded-lg hover:bg-slate-50 transition-colors" onclick="changeDate(-1)">
                        <svg class="w-5 h-5 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
                    </button>
                    <div class="px-4 py-2 bg-slate-50 border border-slate-200 rounded-lg font-semibold text-slate-700 flex items-center gap-2 cursor-pointer hover:bg-slate-100 transition-colors" onclick="window.openDatePicker()">
                        <span id="currentDateDisplay">--/--/----</span>
                        <svg class="w-4 h-4 text-blue-600" fill="currentColor" viewBox="0 0 24 24"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20a2 2 0 002 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2zm-7 5h5v5h-5z"/></svg>
                    </div>
                    <button class="p-2 border border-slate-200 rounded-lg hover:bg-slate-50 transition-colors" onclick="changeDate(1)">
                        <svg class="w-5 h-5 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                    </button>
                </div>
            </div>

            <div class="relative mt-2">
                <!-- Sport Tabs and Grid -->
                <div class="sport-level mt-2">
                    <!-- Sport Folder Tabs -->
                    <div id="sportTabsContainer" class="folder-tabs-wrapper">
                        <!-- Rendered by JS -->
                    </div>
                    
                    <!-- Grid Content Box -->
                    <div class="folder-content overflow-hidden relative">
                        
                        <!-- Legend -->
                        <div class="flex flex-wrap items-center gap-6 text-slate-600 px-6 py-4 border-b border-slate-100 bg-white">
                            <div class="chip">
                                <div class="chip-box bg-white border border-slate-300"></div>Available
                            </div>
                            <div class="chip text-slate-800">
                                <div class="chip-box bg-slate-800 border border-slate-900"></div>Booked (Confirmed)
                            </div>
                            <div class="chip text-orange-700">
                                <div class="chip-box bg-orange-300 border border-orange-400"></div>Pending (Hold)
                            </div>
                        </div>
                        <!-- Loading Overlay -->
                        <div id="loadingOverlay" class="absolute inset-0 bg-white/80 z-50 flex items-center justify-center hidden">
                            <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600"></div>
                        </div>

                        <!-- Grid Container -->
                        <div class="timeline-container overflow-auto w-full relative" id="timelineContainer">
                            <div class="timeline-grid bg-white" id="timelineGrid">
                                <!-- Rendered by JS -->
                                <div class="p-8 text-center text-slate-500 col-span-full">Please select a sport tab to view the schedule.</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Hidden date picker input -->
        <input type="text" id="datePickerInput" class="opacity-0 absolute w-0 h-0 overflow-hidden -z-10">
    </div>

    <th:block layout:fragment="pageScripts">
        <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
        <script src="https://npmcdn.com/flatpickr/dist/l10n/vn.js"></script>
        
        <script th:inline="javascript">
            let currentFacilitySportId = null;
            let currentFacilityId = null;
            let currentDateObj = new Date();
            let currentDate = currentDateObj.toISOString().split('T')[0];
            
            const timelineGrid = document.getElementById('timelineGrid');
            const loadingOverlay = document.getElementById('loadingOverlay');
            const currentDateDisplay = document.getElementById('currentDateDisplay');
            const facilityTabsContainer = document.getElementById('facilityTabsContainer');
            const sportTabsContainer = document.getElementById('sportTabsContainer');

            // Parse Facilities and Sports from DOM
            const fsDataElements = document.querySelectorAll('.fs-item');
            const facilitiesMap = {};
            fsDataElements.forEach(el => {
                const fsId = el.dataset.fsId;
                const fId = el.dataset.facilityId;
                const fName = el.dataset.facilityName;
                const sId = el.dataset.sportId;
                const sName = el.dataset.sportName;
                
                if(!facilitiesMap[fId]) {
                    facilitiesMap[fId] = { id: fId, name: fName, sports: [] };
                }
                facilitiesMap[fId].sports.push({ fsId: fsId, id: sId, name: sName });
            });
            const facilitiesList = Object.values(facilitiesMap);

            function initTabs() {
                if (facilitiesList.length === 0) {
                    facilityTabsContainer.innerHTML = '<div class="px-6 py-4 text-sm text-slate-500 italic">No active facilities or sports found.</div>';
                    return;
                }

                // Render Facility Tabs
                facilitiesList.forEach((fac, index) => {
                    const btn = document.createElement('button');
                    btn.className = 'folder-tab fac-tab';
                    if (index === 0) {
                        btn.classList.add('folder-tab-active');
                        currentFacilityId = fac.id;
                    } else {
                        btn.classList.add('folder-tab-inactive');
                    }
                    btn.textContent = fac.name;
                    btn.onclick = () => switchFacilityTab(fac.id, btn);
                    facilityTabsContainer.appendChild(btn);
                });

                if (currentFacilityId) {
                    renderSportTabs(currentFacilityId);
                }
            }

            function switchFacilityTab(facilityId, btn) {
                document.querySelectorAll('.fac-tab').forEach(el => {
                    el.classList.remove('folder-tab-active');
                    el.classList.add('folder-tab-inactive');
                });
                
                btn.classList.remove('folder-tab-inactive');
                btn.classList.add('folder-tab-active');
                
                currentFacilityId = facilityId;
                renderSportTabs(facilityId);
            }

            function renderSportTabs(facilityId) {
                sportTabsContainer.innerHTML = '';
                const fac = facilitiesMap[facilityId];
                if (!fac || fac.sports.length === 0) return;

                fac.sports.forEach((sport, index) => {
                    const btn = document.createElement('button');
                    btn.className = 'folder-tab sport-tab';
                    // Make sport tabs slightly smaller padding if desired, but keeping them same for consistency
                    btn.style.padding = '8px 20px';
                    
                    if (index === 0) {
                        btn.classList.add('folder-tab-active');
                        currentFacilitySportId = sport.fsId;
                    } else {
                        btn.classList.add('folder-tab-inactive');
                    }
                    btn.textContent = sport.name;
                    btn.onclick = () => switchSportTab(sport.fsId, btn);
                    sportTabsContainer.appendChild(btn);
                });

                if (currentFacilitySportId) {
                    loadTimelineData();
                }
            }

            function switchSportTab(fsId, btn) {
                document.querySelectorAll('.sport-tab').forEach(el => {
                    el.classList.remove('folder-tab-active');
                    el.classList.add('folder-tab-inactive');
                });
                btn.classList.remove('folder-tab-inactive');
                btn.classList.add('folder-tab-active');
                
                currentFacilitySportId = fsId;
                loadTimelineData();
            }

            // Initialize DatePicker
            let fpInstance = null;
            try {
                fpInstance = flatpickr("#datePickerInput", {
                    locale: "vn",
                    dateFormat: "Y-m-d",
                    defaultDate: currentDate,
                    onChange: function(selectedDates, dateStr, instance) {
                        if (selectedDates.length > 0) {
                            currentDateObj = selectedDates[0];
                            currentDate = dateStr;
                            updateDateDisplay(currentDateObj);
                            loadTimelineData();
                        }
                    }
                });
                
                window.openDatePicker = function() {
                    if (fpInstance) {
                        fpInstance.open();
                    }
                };
            } catch (e) {
                console.warn("Flatpickr failed to initialize:", e);
            }

            function updateDateDisplay(dateObj) {
                const d = dateObj.getDate().toString().padStart(2, '0');
                const m = (dateObj.getMonth() + 1).toString().padStart(2, '0');
                const y = dateObj.getFullYear();
                currentDateDisplay.textContent = `${d}/${m}/${y}`;
            }

            window.changeDate = function(days) {
                currentDateObj.setDate(currentDateObj.getDate() + days);
                currentDate = currentDateObj.toISOString().split('T')[0];
                updateDateDisplay(currentDateObj);
                if (fpInstance) {
                    fpInstance.setDate(currentDateObj);
                }
                loadTimelineData();
            }

            // Initial load
            updateDateDisplay(currentDateObj);
            initTabs();

            async function loadTimelineData() {
                if (!currentFacilitySportId) return;
                
                loadingOverlay.classList.remove('hidden');
                
                try {
                    const res = await fetch(`/api/owner/booking/timeline?facilitySportId=${currentFacilitySportId}&date=${currentDate}`);
                    if (!res.ok) throw new Error("Failed to fetch data");

                    const data = await res.json();
                    renderGrid(data);
                } catch (error) {
                    console.error("Error loading timeline:", error);
                    timelineGrid.innerHTML = `<div class="p-8 text-center text-slate-500 col-span-full">Lỗi khi tải dữ liệu. Vui lòng thử lại.</div>`;
                } finally {
                    loadingOverlay.classList.add('hidden');
                }
            }

            function renderGrid(data) {
                timelineGrid.innerHTML = '';
                const courts = data.courts || [];
                if (courts.length === 0) {
                    timelineGrid.innerHTML = `<div class="p-8 text-center text-slate-500 col-span-full">Không có sân nào hoạt động.</div>`;
                    return;
                }

                const numSlots = courts[0].slots.length;
                timelineGrid.style.setProperty('--total-slots', numSlots);

                // Render Header Row
                const headerFrag = document.createDocumentFragment();
                const cornerCell = document.createElement('div');
                cornerCell.className = 'timeline-header court-name text-xs uppercase tracking-wider text-slate-400 font-bold border-b border-slate-200';
                cornerCell.textContent = 'COURT / TIME';
                headerFrag.appendChild(cornerCell);

                courts[0].slots.forEach(slot => {
                    const timeCell = document.createElement('div');
                    timeCell.className = 'timeline-header timeline-cell font-medium text-xs';
                    timeCell.textContent = slot.startTime;
                    headerFrag.appendChild(timeCell);
                });
                timelineGrid.appendChild(headerFrag);

                // Render Courts and Slots
                courts.forEach(court => {
                    const courtFrag = document.createDocumentFragment();

                    const nameCell = document.createElement('div');
                    nameCell.className = 'timeline-cell court-name text-xs text-slate-700';
                    nameCell.textContent = court.courtName;
                    courtFrag.appendChild(nameCell);

                    court.slots.forEach(slot => {
                        const slotCell = document.createElement('div');
                        slotCell.className = 'timeline-cell';

                        if (slot.status === 'BOOKED') {
                            slotCell.classList.add('slot-booked');
                            const bName = slot.bookerName || 'Guest';
                            const bPhone = slot.bookerPhone || 'N/A';
                            slotCell.innerHTML = `
                                <span class="font-bold text-xs uppercase tracking-wider">Booked</span>
                                <div class="booking-tooltip">
                                    <div class="font-bold text-slate-800 mb-1 text-sm">${bName}</div>
                                    <div class="text-slate-500 flex items-center gap-1.5 font-medium">
                                        <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>
                                        ${bPhone}
                                    </div>
                                </div>
                            `;
                        } else if (slot.status === 'HOLD') {
                            slotCell.classList.add('slot-hold');
                            const bName = slot.bookerName || 'Guest';
                            const bPhone = slot.bookerPhone || 'N/A';
                            slotCell.innerHTML = `
                                <span class="font-bold text-orange-900 text-xs uppercase tracking-wider">Pending</span>
                                <div class="booking-tooltip">
                                    <div class="font-bold text-slate-800 mb-1 text-sm">${bName}</div>
                                    <div class="text-slate-500 flex items-center gap-1.5 font-medium">
                                        <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>
                                        ${bPhone}
                                    </div>
                                </div>
                            `;
                        } else {
                            slotCell.classList.add('slot-available');
                        }

                        courtFrag.appendChild(slotCell);
                    });
                    timelineGrid.appendChild(courtFrag);
                });
            }

            // Initial load
            updateDateDisplay(currentDateObj);
            if (currentFacilitySportId) {
                loadTimelineData();
            }

        </script>
    </th:block>
</body>
</html>
